<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Panel</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="hierarchy.css">
</head>
<body>
  <header class="toolbar">
    <!-- Toolbar: navigation (leading) | actions (trailing). Two groups only. -->
    <div class="topnav">
      <!-- Main menu as a tab bar: symbol above a one-word label (Montar is hidden for now; #build stays in the page). -->
      <nav class="tabbar" id="views">
        <button data-v="browse" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h4A1.5 1.5 0 0 1 11 5.5v4A1.5 1.5 0 0 1 9.5 11h-4A1.5 1.5 0 0 1 4 9.5ZM13 5.5A1.5 1.5 0 0 1 14.5 4h4A1.5 1.5 0 0 1 20 5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 13 9.5ZM4 14.5A1.5 1.5 0 0 1 5.5 13h4a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 9.5 20h-4A1.5 1.5 0 0 1 4 18.5ZM15 14.5l4 2.5-4 2.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Navegar</span></button>
        <button data-v="edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Editar</span></button>
        <button data-v="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5a4 4 0 0 0-5 5L4 16v4h4l5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ferramentas</span></button>
      </nav>
      <button class="iconbtn plain" id="openSearch" title="Busca rápida">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="langwrap" data-noi18n>
        <button class="iconbtn plain" id="langBtn" title="Idioma" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18ZM3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="langmenu hidden" id="langMenu" role="menu">
          <div class="lm-title" data-lm="names">Títulos</div>
          <button data-part="names" data-lang="pt" role="menuitemradio">Português</button>
          <button data-part="names" data-lang="en" role="menuitemradio">English</button>
          <div class="lm-sep"></div>
          <div class="lm-title" data-lm="ui">Explicações</div>
          <button data-part="ui" data-lang="pt" role="menuitemradio">Português</button>
          <button data-part="ui" data-lang="en" role="menuitemradio">English</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================== BROWSE
       Hierarchy (HIG Layout): find (search) -> scope (section + category) -> content (visual grid) -> act (bottom bar).
       Wide panels get a sidebar (two levels); narrow panels swap it for a segmented control + category chips. -->
  <section id="browse" class="view">
    <div class="browsehead">
      <div class="searchrow">
        <button id="sideToggle" class="iconbtn plain" title="Mostrar/ocultar barra lateral">
          <svg viewBox="0 0 16 16"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 3v10" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Buscar animações">
        </label>
        <button id="favFilter" class="iconbtn plain" title="Favoritos">
          <svg viewBox="0 0 16 16"><path d="M8 1.9l1.8 3.7 4.1.6-3 2.9.7 4.1L8 11.3l-3.6 1.9.7-4.1-3-2.9 4.1-.6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="scopebar">
        <div class="segmented" id="secSeg"></div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div class="split">
      <aside id="tree" class="tree"></aside>
      <main id="grid" class="grid"></main>
    </div>
    <!-- Action bar: what is selected, its duration, one prominent action. Secondary options live in the ⋯ menu. -->
    <footer class="actionbar" id="actionbar">
      <div class="selrow">
        <span class="selthumb" id="selThumb"></span>
        <div class="seltxt"><b id="selName">Nenhuma animação</b><small id="selCat">Escolha uma na grade.</small></div>
        <span class="dur" title="Duração em frames">
          <span class="stepper"><button data-f="-1" type="button">−</button><input id="frames" class="num" type="number" min="1" max="600" value="15"><button data-f="1" type="button">+</button></span><em>fr</em>
        </span>
        <button class="iconbtn plain" id="moreBtn" title="Mais opções" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="animbtns" id="animBtns">
        <button data-mode="in" class="prominent" disabled>Entrada</button>
        <button data-mode="out" disabled>Saída</button>
        <button data-mode="both" disabled>Entrada e Saída</button>
      </div>
      <div class="animbtns hidden" id="loopBtns">
        <button data-mode="loop" class="prominent" disabled>Aplicar loop</button>
      </div>
      <div class="statusrow"><span id="status" class="status"></span></div>
      <div class="popmenu hidden" id="moreMenu" role="menu">
        <div class="pm-title">Opções</div>
        <label class="pm-row"><span>Duração</span><input id="framesRange" type="range" min="2" max="90" value="15"></label>
        <label class="pm-row"><span>Escalonar</span><span class="stepper"><button data-d="-1" type="button">−</button><input id="stagger" class="num" type="number" min="0" max="120" value="0"><button data-d="1" type="button">+</button></span><em>fr</em></label>
        <label class="pm-row"><span>Começar no playhead</span><span class="switch"><input id="playhead" type="checkbox"><i></i></span></label>
        <div class="pm-sep"></div>
        <button class="pm-item" data-mode="scenes" disabled title="Selecione 2+ layers (cenas): sobrepõe cada par pela duração e aplica a saída numa e a entrada na seguinte">Entre cenas</button>
        <button class="pm-item destructive" id="clear" title="Remove keyframes de transformação e tudo que o painel criou (prefixo MP) nas layers selecionadas">Limpar layers selecionadas</button>
      </div>
    </footer>
  </section>

  <!-- ===================== BUILD: entrance + loop + exit in one click -->
  <section id="build" class="view hidden">
    <div class="toolhead"><b>Monte sua animação</b><span>Escolha a entrada, um loop opcional e a saída. Tudo é aplicado de uma vez nas layers selecionadas.</span></div>
    <main class="toolbody" id="buildBody"></main>
    <footer class="statusrow single"><span id="buildStatus" class="status"></span></footer>
  </section>

  <!-- ===================== EDIT: effects applied to the selected layer -->
  <section id="edit" class="view hidden">
    <div class="toolhead"><b id="editTitle">Editar</b><span id="editSub">Selecione uma layer com efeitos do Motion Panel.</span></div>
    <main class="toolbody" id="editBody"></main>
    <footer class="statusrow single"><span id="editStatus" class="status"></span></footer>
  </section>

  <!-- ===================== TOOLS
       Narrow panel: a grid of tools (home) -> the tool with a Back button (nested views, HIG Layout).
       Wide panel: the same list becomes a sidebar next to the tool. -->
  <section id="tools" class="view hidden">
    <div class="toolsplit">
      <div class="toolnav">
        <div class="toolnav-head"><b>Ferramentas</b><span>Selecione layers e escolha uma ferramenta.</span></div>
        <nav class="tooltabs" id="toolTabs"></nav>
      </div>
      <div class="toolmain">
        <div class="toolhead">
          <button class="backbtn" id="toolBack" title="Todas as ferramentas"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ferramentas</span></button>
          <div class="th-row"><span class="th-ico" id="toolIco"></span><div class="th-txt"><b id="toolTitle"></b><span id="toolDesc"></span></div></div>
        </div>
        <div class="segmented small subtabs hidden" id="toolSubs"></div>
        <main id="toolBody" class="toolbody"></main>
      </div>
    </div>
    <footer class="statusrow single"><span id="toolStatus" class="status"></span></footer>
  </section>

  <!-- ===================== QUICK SEARCH overlay (also available as the floating "Motion Panel Busca" window) -->
  <div id="searchOverlay" class="sp-overlay hidden">
    <div class="sp-box">
      <div id="searchMount" class="sp-host"></div>
      <div class="sp-settings">
        <label>Atalho no painel
          <select id="searchKey">
            <option value="ctrl+space">Ctrl + Espaço</option>
            <option value="alt+space">Alt/Option + Espaço</option>
            <option value="shift+space">Shift + Espaço</option>
            <option value="mod+k">Ctrl/Cmd + K</option>
          </select>
        </label>
        <button class="pill" id="searchHelpBtn">Atalho com o AE em primeiro plano…</button>
      </div>
      <div id="searchHelp" class="sp-help hidden"></div>
    </div>
  </div>

  <script src="presets.js"></script>
  <script src="bridge.js"></script>
  <script src="i18n.js"></script>
  <script src="boxes.js"></script>
  <script src="search.js"></script>
  <script src="main.js"></script>
  <script src="tools.js"></script>
  <script src="build.js"></script>
  <script src="edit.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
